<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Admin - Kopi Senja</title>
    <link rel="icon" href="/img/Vintage Logo Kedai Kopi Simpel.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="mb-4">Dashboard Pesanan Masuk</h2>
        <div class="card shadow-sm border-0">
            <div class="card-body">
                <table class="table table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>Waktu</th>
                            <th>Nama & Catatan</th>
                            <th>Rincian Pesanan</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody id="tabel-admin">
                        </tbody>
                </table>
                <button onclick="bersihkanData()" class="btn btn-danger btn-sm mt-3">Bersihkan Semua Riwayat</button>
            </div>
        </div>
    </div>

    <script>
        function muatDataAdmin() {
            let dataAdmin = JSON.parse(localStorage.getItem('databasePesananSenja')) || [];
            let tbody = document.getElementById('tabel-admin');
            tbody.innerHTML = '';

            if(dataAdmin.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center">Belum ada pesanan.</td></tr>';
                return;
            }

            dataAdmin.forEach(order => {
                let rincian = order.pesanan.map(item => `${item.nama} (x${item.qty})`).join('<br>');
                
                tbody.innerHTML += `
                    <tr>
                        <td>${order.waktu}</td>
                        <td><strong>${order.nama}</strong><br><small class="text-muted">${order.catatan}</small></td>
                        <td>${rincian}</td>
                        <td class="fw-bold">${order.total}</td>
                    </tr>
                `;
            });
        }

        function bersihkanData() {
            if(confirm("Yakin ingin menghapus semua riwayat pesanan?")) {
                localStorage.removeItem('databasePesananSenja');
                muatDataAdmin();
            }
        }

        muatDataAdmin();
    </script>
</body>
</html>
